<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="img/favicon-32x32.png">
  
  <title>Pane</title>
  <link rel="stylesheet" href="aer.css">
</head>
<body>
  <nav class="menu">
  <a href="mio.html">Home</a>
  
  <a href="progetti.html" >Progetti</a>
  <a href="contatti.html"class="attivo">Contatti</a>
</nav>

  <div class="scheda">
    <h1>Contatti</h1>

    
    <div id="domanda">
      <p>Per vedere i miei contatti rispondi: 67?</p>
      <button onclick="rispondi(true)">Sì</button>
      <button onclick="rispondi(false)">No</button>
    </div>

    
    <div id="contatti" class="nascosto">
     <img src="img/giusto.jpg" alt="Risposta giusta">
      <p>Email: <a href="simone.panelli@galileo.galileicrema.it">simone.panelli@galileo.galileicrema.it</a></p>
      <p>Telefono: +39 3755513385</p>
    </div>

    
    <div id="errore" class="errore nascosto">
      <p>Risposta sbagliata!</p>
      <img src="img/sbagliato.jpg" alt="Risposta sbagliata">
      <p><button onclick="riprova()">Riprova</button></p>
    </div>
  </div>

  <script>
    
    var giusta = true;

    function rispondi(scelta) {
      document.getElementById("domanda").classList.add("nascosto");
      if (scelta === giusta) {
        document.getElementById("contatti").classList.remove("nascosto");
      } else {
        document.getElementById("errore").classList.remove("nascosto");
      }
    }

    function riprova() {
      document.getElementById("errore").classList.add("nascosto");
      document.getElementById("domanda").classList.remove("nascosto");
    }
  </script>
</body>
</html>
